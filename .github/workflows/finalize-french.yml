name: Vérifier et finaliser le français
on:
  push:
    branches: [definitions-fr]
    paths: ['.github/workflows/finalize-french.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: definitions-fr
      - run: python3 scripts/validate_french.py
      - run: |
          git add docs/data/lex-fr-*.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Finaliser les traductions françaises contrôlées'
          git push origin HEAD:definitions-fr
